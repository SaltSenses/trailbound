name: Publish verified Android preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the successful source build and exact APK
        run: |
          set -euo pipefail
          gh run view 41395739871 --json conclusion,headSha --jq '(.conclusion == "success" and .headSha == "16105de1b54f9e5a29fa184f38aca755d2e42b50")' | grep -qx true
          gh run download 41395739871 --name trailbound-android-preview --dir preview-artifact
          mkdir -p preview-files
          cp preview-artifact/outputs/apk/debug/app-debug.apk preview-files/trailbound-android-preview.apk
          printf '%s  %s\n' 'b42922603a55914570cdc66f1328e639a18855fc2e18b860cc94db2e4a692014' 'trailbound-android-preview.apk' > preview-files/SHA256SUMS
          (cd preview-files && sha256sum -c SHA256SUMS)
      - name: Publish the frozen device-test download
        run: |
          set -euo pipefail
          if gh release view v0.7.0-preview > /dev/null 2>&1; then
            mkdir -p existing-preview
            gh release download v0.7.0-preview --pattern trailbound-android-preview.apk --dir existing-preview
            printf '%s  %s\n' 'b42922603a55914570cdc66f1328e639a18855fc2e18b860cc94db2e4a692014' 'existing-preview/trailbound-android-preview.apk' | sha256sum -c -
          else
            gh release create v0.7.0-preview preview-files/trailbound-android-preview.apk preview-files/SHA256SUMS --target 16105de1b54f9e5a29fa184f38aca755d2e42b50 --prerelease --title 'Trailbound Android 0.7.0 — Pixel device test' --notes-file docs/android-preview.md
          fi
