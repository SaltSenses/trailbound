plugins { id 'com.android.application' }
android {
 namespace 'ca.trailbound.app'
 compileSdk 36
 defaultConfig { applicationId 'ca.trailbound.app'; minSdk 26; targetSdk 36; versionCode 7; versionName '0.7.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = ['../../public'] } }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0'; testImplementation 'junit:junit:4.13.2' }
